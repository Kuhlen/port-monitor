[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
authors = ["kuhlen"]
publish = false

[workspace.dependencies]
data = { path = "crates/data" }
domain = { path = "crates/domain" }
# renderer picked per OS in crates/app/Cargo.toml
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit"] }
slint-build = "=1.18.1"

# Win7 compatibility: see patches/README.md
[patch.crates-io]
i-slint-backend-winit = { path = "patches/i-slint-backend-winit" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
